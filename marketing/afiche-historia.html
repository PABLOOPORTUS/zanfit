  @font-face { font-family: 'SG'; src: url('../node_modules/@fontsource-variable/space-grotesk/files/space-grotesk-latin-wght-normal.woff2') format('woff2'); font-weight: 300 700; }

  html, body { width: 1080px; height: 1920px; }
  body {

    overflow: hidden;

  .logo { display: flex; align-items: center; gap: 30px; }

  .lista { margin-top: 40px; display: flex; flex-direction: column; gap: 18px; font-size: 34px; font-weight: 500; }
  .lista div { display: flex; gap: 20px; align-items: center; }
  .lista b { display: grid; place-items: center; width: 64px; height: 64px; flex: none; border-radius: 18px; background: rgba(198, 255, 61, 0.12); font-size: 34px; }

  .tarjeta {

  .tarjeta p { margin-top: 12px; font-size: 32px; font-weight: 700; color: #4d7a00; }
  .pie { margin-top: 30px; text-align: center; font-size: 30px; font-weight: 500; color: #d4d4d4; }
  .pie strong { font-weight: 700; color: #c6ff3d; }
